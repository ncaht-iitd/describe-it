<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Describe-it: accessible descriptions and tactile versions of educational diagrams." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Describe-it</title>
    <script>
      // Apply saved display settings before the page draws, so it never flashes the wrong theme.
      try {
        var r = document.documentElement, g = function (k) { return localStorage.getItem(k); };
        var t = g('di-theme'); if (t && t !== 'system') r.setAttribute('data-theme', t);
        var z = g('di-text-scale'); if (z && z !== '100') r.style.fontSize = z + '%';
        var lh = g('di-line-height'); if (lh) r.style.setProperty('--line-height', lh);
        var ws = g('di-word-spacing'); if (ws && ws !== '0') r.style.setProperty('--word-spacing', ws + 'em');
        if (g('di-reading') === 'on') r.setAttribute('data-reading', 'on');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
