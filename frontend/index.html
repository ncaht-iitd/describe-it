<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Describe-it: accessible descriptions and tactile versions of educational diagrams." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Describe-it</title>
    <script>
      // Apply saved display settings before the page draws, so it never flashes the wrong theme.
      try {
        var t = localStorage.getItem('di-theme');
        if (t && t !== 'system') document.documentElement.setAttribute('data-theme', t);
        var s = localStorage.getItem('di-text-size');
        if (s) document.documentElement.setAttribute('data-text-size', s);
        var sp = localStorage.getItem('di-spacing');
        if (sp) document.documentElement.setAttribute('data-spacing', sp);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
